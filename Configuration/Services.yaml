services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  BrainAppeal\CampusEventsConvert2News\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Domain/Model/*'
      - '../Classes/**/Exception.php'

  BrainAppeal\CampusEventsConvert2News\Converter\Event2NewsConverter:
    public: true
    #shared: true

  BrainAppeal\CampusEventsConvert2News\Command\ConvertCommand:
    tags:
      - name: 'console.command'
        command: 'ce:convert:news'
        description: 'Campus Events Converter2News: Convert event records to news'
